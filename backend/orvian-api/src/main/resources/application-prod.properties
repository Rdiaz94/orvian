# Perfil de producción: no contiene secretos; todo valor sensible llega por variables de entorno
# Dirección de la base de datos
spring.datasource.url=${ORVIAN_DB_URL}
# Usuario de la aplicación en la base de datos
spring.datasource.username=${ORVIAN_DB_USUARIO}
# Contraseña de ese usuario
spring.datasource.password=${ORVIAN_DB_CLAVE}
# Secreto con el que se firman los tokens JWT
orvian.seguridad.jwt.secreto=${ORVIAN_JWT_SECRETO}
# Sitios web que pueden llamar a la API desde un navegador, separados por comas
orvian.cors.origenes-permitidos=${ORVIAN_CORS_ORIGENES}
# Crea las tablas que falten al arrancar; después del primer despliegue conviene cambiarlo a validate
spring.jpa.hibernate.ddl-auto=update
# En producción no se imprimen las consultas SQL
spring.jpa.show-sql=false
# La documentación Swagger permanece apagada
springdoc.api-docs.enabled=false
# La interfaz de Swagger permanece apagada
springdoc.swagger-ui.enabled=false
