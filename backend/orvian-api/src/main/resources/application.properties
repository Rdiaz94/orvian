# Nombre de la aplicación
spring.application.name=orvian-api
# Puerto donde escucha el servidor en desarrollo
server.port=8080
# Perfil por defecto al desarrollar: carga application-local.properties; en Tomcat el perfil prod lo activa ServletInitializer
spring.profiles.default=local
# Dirección de la base de datos PostgreSQL local
spring.datasource.url=jdbc:postgresql://localhost:5432/orvian
# Usuario de la aplicación en PostgreSQL
spring.datasource.username=orvian_app
# Crea y actualiza las tablas según las entidades (solo para desarrollo)
spring.jpa.hibernate.ddl-auto=update
# Evita mantener la conexión abierta durante la vista y reduce consultas ocultas
spring.jpa.open-in-view=false
# Muestra en consola las consultas SQL que ejecuta Hibernate
spring.jpa.show-sql=true
# Duración del token de acceso, en minutos
orvian.seguridad.jwt.expiracion-minutos=120
# Secreto para firmar los tokens: se toma de la variable de entorno o de application-local.properties; vacío impide arrancar
orvian.seguridad.jwt.secreto=${ORVIAN_JWT_SECRETO:}
# Orígenes que pueden llamar a la API desde un navegador, separados por comas; en producción va el dominio real
orvian.cors.origenes-permitidos=http://localhost:4200
# La documentación Swagger viene apagada por defecto; se enciende solo en application-local.properties
springdoc.api-docs.enabled=false
# La interfaz de Swagger también viene apagada por defecto
springdoc.swagger-ui.enabled=false
# Fallos de inicio de sesión permitidos por cuenta y por IP dentro de la ventana, y duración de esa ventana
orvian.seguridad.login.max-intentos-cuenta=5
# Fallos permitidos desde una misma IP sumando todas las cuentas
orvian.seguridad.login.max-intentos-ip=50
# Minutos durante los que cuenta cada fallo
orvian.seguridad.login.ventana-minutos=15
