<!-- Panel de arte con esquinas muy redondeadas -->
<section class="arte">
  <!-- Ilustración: el anillo del logo en grande, con órbitas y nodos -->
  <svg class="arte-fondo" viewBox="0 0 400 400" aria-hidden="true">
    <defs>
      <!-- Degradado del anillo -->
      <linearGradient id="arte-aro" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fdba30" />
        <stop offset="0.55" stop-color="#ad29ff" />
        <stop offset="1" stop-color="#1762ca" />
      </linearGradient>
      <!-- Resplandor morado detrás del anillo -->
      <radialGradient id="arte-brillo">
        <stop offset="0" stop-color="#ad29ff" stop-opacity="0.5" />
        <stop offset="1" stop-color="#ad29ff" stop-opacity="0" />
      </radialGradient>
    </defs>
    <!-- Resplandor -->
    <circle cx="200" cy="200" r="195" fill="url(#arte-brillo)" />
    <!-- Órbitas inclinadas -->
    <ellipse cx="200" cy="200" rx="185" ry="68" fill="none" stroke="#ffffff" stroke-opacity="0.16" transform="rotate(-28 200 200)" />
    <ellipse cx="200" cy="200" rx="185" ry="68" fill="none" stroke="#ffffff" stroke-opacity="0.1" transform="rotate(32 200 200)" />
    <!-- Conexiones entre los tres integrantes -->
    <polygon points="200,80 303.9,260 96.1,260" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" />
    <!-- Anillo principal -->
    <circle cx="200" cy="200" r="120" fill="none" stroke="url(#arte-aro)" stroke-width="26" />
    <!-- Nodo ámbar -->
    <circle cx="200" cy="80" r="22" fill="#fdba30" />
    <!-- Nodo azul -->
    <circle cx="303.9" cy="260" r="22" fill="#1762ca" />
    <!-- Nodo morado -->
    <circle cx="96.1" cy="260" r="22" fill="#ad29ff" />
    <!-- Centro del anillo -->
    <circle cx="200" cy="200" r="7" fill="#ffffff" fill-opacity="0.85" />
    <!-- Estrellas decorativas -->
    <circle cx="40" cy="60" r="2" fill="#ffffff" fill-opacity="0.7" />
    <circle cx="360" cy="110" r="1.6" fill="#ffffff" fill-opacity="0.6" />
    <circle cx="70" cy="330" r="1.8" fill="#ffffff" fill-opacity="0.5" />
    <circle cx="345" cy="345" r="2.2" fill="#ffffff" fill-opacity="0.6" />
  </svg>

  <!-- Mensaje de bienvenida -->
  <div class="arte-texto">
    <!-- Nombre de la marca -->
    <span class="arte-marca">Orvian</span>
    <!-- Título -->
    <h2 class="arte-titulo">{{ titulo() }}</h2>
    <!-- Descripción -->
    <p class="arte-descripcion">{{ texto() }}</p>
  </div>

  <!-- Tarjeta inferior -->
  <div class="arte-tarjeta">
    <!-- Título de la tarjeta -->
    <h3 class="arte-tarjeta-titulo">{{ tarjetaTitulo() }}</h3>
    <!-- Texto de la tarjeta -->
    <p class="arte-tarjeta-texto">{{ tarjetaTexto() }}</p>
    <!-- Círculos decorativos de colores -->
    <div class="arte-avatares" aria-hidden="true">
      <span class="avatar av-ambar">A</span>
      <span class="avatar av-azul">L</span>
      <span class="avatar av-morado">M</span>
    </div>
  </div>
</section>
