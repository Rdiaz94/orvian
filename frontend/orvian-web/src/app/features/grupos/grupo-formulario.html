<!-- Fondo oscuro; al pulsarlo se cierra el diálogo -->
<div class="or-modal-fondo" (click)="cancelado.emit()" (keydown.escape)="cancelado.emit()" role="presentation">
  <!-- Caja del diálogo; detiene el clic para que no se cierre al usarla -->
  <div class="or-tarjeta or-modal p-4" role="dialog" aria-modal="true" aria-labelledby="titulo-dialogo" tabindex="-1" (click)="$event.stopPropagation()" (keydown.escape)="cancelado.emit()">
    <!-- Título -->
    <h2 id="titulo-dialogo" class="h4 fw-bold mb-3">Nuevo grupo</h2>

    @if (error(); as mensaje) {
      <!-- Error devuelto por la API -->
      <div class="alert alert-danger" role="alert">{{ mensaje }}</div>
    }

    <!-- Formulario del grupo -->
    <form [formGroup]="formulario" (ngSubmit)="guardar()" novalidate>
      <!-- Campo del nombre -->
      <div class="mb-3">
        <!-- Etiqueta del campo -->
        <label class="form-label fw-semibold" for="nombre">Nombre</label>
        <!-- Campo de texto -->
        <input id="nombre" type="text" class="form-control or-campo" formControlName="nombre" [class.is-invalid]="invalido(formulario.controls.nombre) || erroresServidor()['nombre']" />
        <!-- Mensaje de validación -->
        <div class="invalid-feedback">{{ erroresServidor()['nombre'] ?? 'El nombre es obligatorio (máximo 100 caracteres).' }}</div>
      </div>
      <!-- Campo de la descripción -->
      <div class="mb-3">
        <!-- Etiqueta del campo -->
        <label class="form-label fw-semibold" for="descripcion">Descripción <span class="text-secondary fw-normal">(opcional)</span></label>
        <!-- Área de texto -->
        <textarea id="descripcion" rows="2" class="form-control or-campo" formControlName="descripcion" [class.is-invalid]="invalido(formulario.controls.descripcion)"></textarea>
        <!-- Mensaje de validación -->
        <div class="invalid-feedback">Máximo 500 caracteres.</div>
      </div>
      <!-- Campo del curso -->
      <div class="mb-4">
        <!-- Etiqueta del campo -->
        <label class="form-label fw-semibold" for="curso">Curso</label>
        <!-- Lista desplegable -->
        <select id="curso" class="form-select or-campo" formControlName="cursoId">
          <!-- Opción sin curso -->
          <option [ngValue]="null">Sin curso</option>
          @for (curso of cursos(); track curso.id) {
            <!-- Un curso disponible -->
            <option [ngValue]="curso.id">{{ curso.nombre }}</option>
          }
        </select>
      </div>
      <!-- Botones -->
      <div class="d-flex justify-content-end gap-2">
        <!-- Cierra sin guardar -->
        <button type="button" class="or-boton-suave" (click)="cancelado.emit()">Cancelar</button>
        <!-- Crea el grupo -->
        <button type="submit" class="or-boton" [disabled]="cargando()">
          @if (cargando()) {
            <!-- Indicador de carga -->
            <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
          }
          Crear grupo
        </button>
      </div>
    </form>
  </div>
</div>
